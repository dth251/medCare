server:
  port: 8080

spring:
  application:
    name: medcare-clinic-backend

  jackson:
    serialization:
      fail-on-empty-beans: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/phongkham_m2}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  sql:
    init:
      # Lược đồ do Hibernate quản lý; db/schema.sql chỉ dùng khi tạo CSDL mới bằng tay
      mode: never

  jpa:
    # API chỉ trả DTO được dựng trong transaction, không cần giữ session tới tầng view
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  # Đặt biến môi trường JWT_SECRET (Base64, >= 256 bit) khi triển khai thật
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: 86400000 # 24 hours
